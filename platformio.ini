; agri-solar-poe — M5Stack ATOM PoE solar radiation node
;
; Hardware
;   - M5Stack ATOM Lite + ATOM PoE Base (W5500)
;   - M5Stack ADC Unit V1.1 (ADS1110, I2C 0x48) on Grove (SDA=G26, SCL=G32)
;   - PVSS-03 全天日射計 (or equivalent: 0–1 V → 0–1000 W/m² linear)

[env:m5atom-poe]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atom
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git#v0.6.1
